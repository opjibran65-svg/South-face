<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOUTH FACE | Premium Footwear & Alpine Gear</title>
    <style>
        :root {
            --bg-primary: #0a0e0d;
            --bg-card: #141a18;
            --accent-green: #2d4a3e;
            --accent-gold: #d4af37;
            --text-main: #f0f4f2;
            --text-muted: #9ab0a6;
            --border-color: #24332c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(180deg, #121b17 0%, var(--bg-primary) 100%);
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 3px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Admin Form Styling */
        .admin-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .admin-box h2 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: var(--accent-gold);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            background: #0d1311;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 5px;
        }

        button.btn-add {
            grid-column: 1 / -1;
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
        }

        button.btn-add:hover {
            background-color: #3b5f50;
        }

        /* Products Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-color: #000;
        }

        .card-body {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .price {
            color: var(--accent-gold);
            font-size: 1.4rem;
            font-weight: bold;
            margin: 0.5rem 0;
        }

        .btn-whatsapp {
            margin-top: auto;
            background-color: #25d366;
            color: black;
            text-decoration: none;
            text-align: center;
            padding: 0.75rem;
            font-weight: bold;
            border-radius: 6px;
            display: block;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>SOUTH FACE</h1>
        <p>Built for any terrain, ready for any weather.</p>
        <p>📍 Near New Bus Stand, Drusoo, Pulwama | 📲 7006256718</p>
    </header>

    <div class="container">
        <!-- Admin Panel for New Stock -->
        <div class="admin-box">
            <h2>📦 Admin: Add New Stock</h2>
            <form id="stockForm" class="form-grid">
                <input type="text" id="pName" placeholder="Shoe Name" required>
                <input type="number" id="pPrice" placeholder="Price (₹)" required>
                <input type="text" id="pImg" placeholder="Image URL / filename.jpg" required>
                <select id="pCat">
                    <option value="Boots">Boots</option>
                    <option value="Sneakers">Sneakers</option>
                    <option value="Winter Wear">Winter Wear</option>
                </select>
                <button type="submit" class="btn-add">Add Product to Store</button>
            </form>
        </div>

        <!-- Dynamic Product Listing -->
        <h2 style="margin-bottom: 1.5rem;">Current Collection</h2>
        <div class="product-grid" id="productGrid"></div>
    </div>

    <footer>
        <p>© 2026 SOUTH FACE. All rights reserved.</p>
        <p>Instagram: @south__face</p>
    </footer>

    <script>
        const phone = "917006256718";
        
        let products = [
            {
                name: "Himmaleh All-Terrain Waterproof Boots",
                price: 6400,
                img: "57525.jpg",
                category: "Boots"
            }
        ];

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            products.forEach(p => {
                const msg = encodeURIComponent(`Hello SOUTH FACE! I want to order ${p.name} for ₹${p.price}.`);
                const card = `
                    <div class="card">
                        <img src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300x250?text=South+Face+Boot'">
                        <div class="card-body">
                            <h3>${p.name}</h3>
                            <div class="price">₹${p.price.toLocaleString('en-IN')}</div>
                            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">Category: ${p.category}</p>
                            <a href="https://wa.me/${phone}?text=${msg}" target="_blank" class="btn-whatsapp">Order on WhatsApp</a>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        document.getElementById('stockForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newProd = {
                name: document.getElementById('pName').value,
                price: Number(document.getElementById('pPrice').value),
                img: document.getElementById('pImg').value,
                category: document.getElementById('pCat').value
            };
            products.unshift(newProd);
            renderProducts();
            this.reset();
        });

        renderProducts();
    </script>
</body>
</html>
